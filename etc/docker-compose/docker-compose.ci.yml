# CI build-only compose for the Athar backend.
#
# Builds the two deployable images from the ABP-generated Dockerfiles,
# following ABP's publish-then-package convention: run `dotnet publish -c
# Release` for each project FIRST, then this compose file packages the
# published output. The Angular frontend was removed 2026-08-26 (moving to
# Athar-Web) — this file no longer builds an angular image.
#
# Paths are relative to this file's directory (etc/docker-compose), so the
# repo root is two levels up.
#
# Usage (from repo root):
#   dotnet publish src/NextStage.Athar.HttpApi.Host/NextStage.Athar.HttpApi.Host.csproj -c Release
#   dotnet publish src/NextStage.Athar.DbMigrator/NextStage.Athar.DbMigrator.csproj -c Release
#   docker compose -f etc/docker-compose/docker-compose.ci.yml build

services:
  api:
    image: nextstagesy/athar-api:ci
    build:
      context: ../../src/NextStage.Athar.HttpApi.Host
      dockerfile: Dockerfile

  db-migrator:
    image: nextstagesy/athar-db-migrator:ci
    build:
      context: ../../src/NextStage.Athar.DbMigrator
      dockerfile: Dockerfile
